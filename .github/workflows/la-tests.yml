name: LA mini-site tests
on:
  push:
    paths: ['la/**', '.github/workflows/la-tests.yml']
  pull_request:
    paths: ['la/**']
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm i --no-save playwright@1.56.1 && npx playwright install --with-deps chromium
      - run: (cd la && python3 -m http.server 8790 &) && sleep 1 && node la/tests/smoke.mjs http://localhost:8790/
